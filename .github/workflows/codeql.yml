# =============================================================================
#  CodeQL - analiza statica de cod nativa GitHub (securitate + calitate)
# =============================================================================
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'         # saptamanal, luni la 03:00 UTC

jobs:
  analyze:
    name: Analiza CodeQL (C#)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Initializare CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Instalare .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # CodeQL are nevoie sa observe build-ul pentru a analiza codul
      - name: Build pentru CodeQL
        run: dotnet build TurnBasedBattleGame.sln --configuration Release

      - name: Analiza CodeQL
        uses: github/codeql-action/analyze@v3
